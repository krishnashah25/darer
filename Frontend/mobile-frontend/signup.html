<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup.css" >
    <title>darer-sign up</title>
</head>
<body>
    <div class="overlay">
        <div class="login-box">
            <div class="top-bar">
                <h2>Join Darer today</h2>
                <span class="close">&times;</span>
            </div>
            
            <div class="usernmame">
                <label>Username</label>
                <input type="text" placeholder="Enter username" />
            </div>

            <div class="usernmame">
                <label>Gmail</label>
                <input type="text" placeholder="Enter Gmail" />
            </div>

            <a href="#" class="email-link">Use email instead</a>
            <p class="info">
                Darer may use your Gmail for send text messages with information regarding your account.
            </p>

            <p class="terms">
                By clicking Sign Up, you agree to Darer's <a href="#">Terms of Service</a> and <a href="#">Privacy Notice</a>.
            </p>

            <button class="signup-btn" disabled>Sign up</button>

            <p class="login-link">Have an account? <a href="login.html">Log in</a></p>
        </div>
    </div>
    <script src="signup.js"></script>

</body>
</html>
