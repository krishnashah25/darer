<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="whisphers.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Darer - Whispers</title>
</head>
<body>
    <div class="whispers-page">
        <h4 class="page-title">Activity</h4>
        <div class="header-buttons">
            <a href="activity.html" class="tab ">Notifications</a>
            <a href="whispers.html" class="tab active">Whispers</a>
        </div>

        <section class="chat-list">
            <div class="chat-item">
                <img src="avatar1.png" alt="User" class="avatar" />
                <div class="chat-info">
                    <h4>@ShadowDragon</h4>
                    <p>Hey! Are you live now? </p>
                    <span class="chat-time">2m ago</span>
                </div>
            </div>

            <div class="chat-item">
                <img src="avatar2.png" alt="User" class="avatar" />
                <div class="chat-info">
                    <h4>@PixelVibe</h4>
                    <p>Let’s stream tonight 👾</p>
                    <span class="chat-time">2m ago</span>
                </div>
            </div>

            <div class="chat-item">
                <img src="avatar3.png" alt="User" class="avatar" />
                <div class="chat-info">
                    <h4>@LunaCraft</h4>
                    <p>You missed the raid 😭</p>
                    <span class="chat-time">2m ago</span>
                </div>
            </div>
        </section>
    </div>

    <footer class="bottombar">
        <a href="index.html">
            <i class="fa-solid fa-house"></i>
            <div>Home</div>
        </a>
        <a href="live_channel.html">
            <i class="fa-solid fa-magnifying-glass"></i>
            <div>Browse</div>
        </a>
        <a href="activity.html">
            <i class="fa-solid fa-bell"></i>
            <div>Activity</div>
        </a>
        <a href="#">
            <i class="fa-solid fa-user"></i>
            <div>Profile</div>
        </a>
    </footer>

</body>
</html>
